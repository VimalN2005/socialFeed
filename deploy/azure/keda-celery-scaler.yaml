apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: scalefeed-celery-worker-scaler
  namespace: scalefeed-prod
spec:
  scaleTargetRef:
    name: scalefeed-celery-worker
  minReplicaCount: 1
  maxReplicaCount: 20
  pollingInterval: 15
  cooldownPeriod: 60
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 120
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
  triggers:
    - type: redis
      metadata:
        addressFromEnv: REDIS_HOST_PORT
        listName: celery
        listLength: "200"
        enableTLS: "true"
      authenticationRef:
        name: keda-redis-auth
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-redis-auth
  namespace: scalefeed-prod
spec:
  secretTargetRef:
    - parameter: password
      name: azure-redis-secret
      key: redis-password
