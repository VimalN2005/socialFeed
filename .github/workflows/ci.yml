name: ScaleFeed CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Build, Lint & Test Microservices
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django System Check & Migrations
        env:
          SECRET_KEY: test-key-ci-environment-scale-feed
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          cd services/core_drf
          python manage.py check
          python manage.py migrate

      - name: Run Django DRF Test Suite
        env:
          SECRET_KEY: test-key-ci-environment-scale-feed
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          cd services/core_drf
          python manage.py test tests -v 2

      - name: Run FastAPI Test Suite
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          cd services/ranking_fastapi
          python -m pytest tests/ -v

      - name: Execute Performance Latency Benchmark
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          python benchmarks/run_benchmark.py
