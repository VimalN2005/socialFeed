<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ScaleFeed ⚡ High-Throughput Social Feed</title>
  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
    .glass-card { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .toast-anim { animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes slideDown {
      from { transform: translateY(-100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body class="min-h-screen pb-16 antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Real-Time WebSocket Toast Notifications Container -->
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

  <!-- Header Navigation -->
  <header class="sticky top-0 z-40 glass-card border-b border-gray-800">
    <div class="max-w-2xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-violet-600 flex items-center justify-center font-black text-xl shadow-lg shadow-indigo-500/20">⚡</div>
        <span class="font-extrabold text-xl tracking-tight bg-gradient-to-r from-white via-gray-200 to-indigo-300 bg-clip-text text-transparent">ScaleFeed</span>
      </div>

      <div class="flex items-center gap-3">
        <!-- WebSocket Live Indicator -->
        <div id="ws-badge" class="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span id="ws-status">Connecting...</span>
        </div>

        <!-- Auth State Button -->
        <div id="user-controls">
          <button id="login-modal-btn" onclick="openAuthModal()" class="px-4 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm transition">Sign In</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-2xl mx-auto px-4 mt-6">

    <!-- Feed Mode Switcher -->
    <div class="flex rounded-xl p-1 bg-gray-900 border border-gray-800 mb-6">
      <button id="tab-ranked" onclick="switchFeedMode('ranked')" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-indigo-600 text-white shadow transition flex items-center justify-center gap-1.5">
        <i data-lucide="sparkles" class="w-4 h-4"></i> AI Smart Feed
      </button>
      <button id="tab-timeline" onclick="switchFeedMode('timeline')" class="flex-1 py-2 text-sm font-semibold rounded-lg text-gray-400 hover:text-white transition flex items-center justify-center gap-1.5">
        <i data-lucide="clock" class="w-4 h-4"></i> Latest (Cursor)
      </button>
    </div>

    <!-- Post Creation Box -->
    <div id="post-box" class="glass-card rounded-2xl p-4 mb-6 shadow-xl hidden">
      <div class="flex items-start gap-3">
        <div id="author-avatar" class="w-10 h-10 rounded-full bg-indigo-500/20 border border-indigo-500/30 flex items-center justify-center font-bold text-indigo-400 uppercase">U</div>
        <div class="flex-1">
          <textarea id="post-caption" rows="3" placeholder="Share what's happening or write about architecture..." class="w-full bg-transparent text-gray-100 placeholder-gray-500 resize-none outline-none text-base"></textarea>
          
          <!-- Media URL Input -->
          <div class="relative mt-2">
            <input id="post-media-url" type="url" placeholder="Attach Image URL (https://...)" class="w-full bg-gray-900/60 border border-gray-800 rounded-xl px-3 py-2 text-sm text-gray-200 outline-none focus:border-indigo-500 transition">
          </div>

          <!-- AI Intelligence Preview Box -->
          <div id="ai-preview" class="hidden mt-3 p-3 rounded-xl bg-indigo-950/30 border border-indigo-800/40 text-xs text-indigo-300">
            <div class="flex items-center justify-between mb-1.5 font-bold">
              <span class="flex items-center gap-1"><i data-lucide="brain-circuit" class="w-3.5 h-3.5"></i> AI Intelligence Insights</span>
              <span id="ai-sentiment-badge" class="px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300">Positive</span>
            </div>
            <p id="ai-headline" class="italic text-gray-300 mb-1"></p>
            <div id="ai-tags-list" class="flex flex-wrap gap-1 mt-1.5"></div>
          </div>

          <!-- Post Actions -->
          <div class="flex items-center justify-between mt-3 pt-3 border-t border-gray-800/80">
            <button onclick="requestAiAnalysis()" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-indigo-400 hover:text-indigo-300 bg-indigo-500/10 hover:bg-indigo-500/20 transition flex items-center gap-1">
              <i data-lucide="wand-2" class="w-3.5 h-3.5"></i> AI Tag Suggestions
            </button>
            <button onclick="publishNewPost()" id="publish-btn" class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm shadow-lg shadow-indigo-600/30 transition flex items-center gap-1.5">
              <span>Publish</span> <i data-lucide="send" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Feed Container -->
    <div id="feed-container" class="space-y-4">
      <!-- Loading Skeleton -->
      <div class="glass-card rounded-2xl p-6 animate-pulse">
        <div class="flex items-center gap-3 mb-4">
          <div class="w-10 h-10 rounded-full bg-gray-800"></div>
          <div class="space-y-2">
            <div class="w-24 h-3 bg-gray-800 rounded"></div>
            <div class="w-16 h-2 bg-gray-800 rounded"></div>
          </div>
        </div>
        <div class="space-y-2 mb-4">
          <div class="w-full h-3 bg-gray-800 rounded"></div>
          <div class="w-3/4 h-3 bg-gray-800 rounded"></div>
        </div>
        <div class="w-full h-48 bg-gray-800 rounded-xl"></div>
      </div>
    </div>

    <!-- Load More Pagination Button -->
    <div class="text-center mt-8">
      <button id="load-more-btn" onclick="fetchFeed()" class="px-6 py-2.5 rounded-xl glass-card text-sm font-semibold text-gray-300 hover:text-white hover:border-gray-700 transition hidden">Load More Posts</button>
    </div>

  </main>

  <!-- Auth Modal (Sign in / Sign up) -->
  <div id="auth-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="glass-card max-w-md w-full rounded-2xl p-6 border border-gray-800 shadow-2xl relative">
      <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>

      <div class="flex rounded-lg bg-gray-900 p-1 mb-5 border border-gray-800">
        <button id="auth-tab-login" onclick="setAuthTab('login')" class="flex-1 py-1.5 rounded-md text-xs font-bold bg-indigo-600 text-white">Login</button>
        <button id="auth-tab-register" onclick="setAuthTab('register')" class="flex-1 py-1.5 rounded-md text-xs font-bold text-gray-400 hover:text-white">Create Account</button>
      </div>

      <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1">Username</label>
          <input id="auth-username" type="text" required class="w-full bg-gray-900 border border-gray-800 rounded-xl px-3 py-2 text-sm text-white outline-none focus:border-indigo-500">
        </div>

        <div id="email-field" class="hidden">
          <label class="block text-xs font-medium text-gray-400 mb-1">Email</label>
          <input id="auth-email" type="email" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-3 py-2 text-sm text-white outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1">Password</label>
          <input id="auth-password" type="password" required class="w-full bg-gray-900 border border-gray-800 rounded-xl px-3 py-2 text-sm text-white outline-none focus:border-indigo-500">
        </div>

        <button type="submit" id="auth-submit-btn" class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm shadow-lg shadow-indigo-600/30 transition mt-4">
          Sign In
        </button>
      </form>
    </div>
  </div>

  <!-- JavaScript App Logic -->
  <script src="/app.js"></script>
</body>
</html>
