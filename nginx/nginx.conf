events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Upstream Microservice Definitions
    upstream drf_backend {
        server core_api:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream fastapi_backend {
        server ranking_api:8001 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Rate Limiting: 50 requests/second per IP with 10MB state storage
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=50r/s;

    # Basic Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    server {
        listen 80;
        server_name localhost;

        # Media & Payload Size Limits (10MB)
        client_max_body_size 10M;

        # Production Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Global Rate Limiting
        limit_req zone=api_rate_limit burst=20 nodelay;

        # Health Check Endpoint
        location /health {
            access_log off;
            return 200 '{"status":"healthy","gateway":"nginx"}\n';
            add_header Content-Type application/json;
        }

        # FastAPI: Feed Ranking & AI Endpoints
        location /api/v1/feed/rank {
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/ai/ {
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # FastAPI: Prometheus Observability Endpoint
        location /metrics {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
        }

        # FastAPI: Real-Time WebSocket Gateway
        location /ws/ {
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Django DRF: Auth, Users, Posts CRUD, Admin
        location /api/ {
            proxy_pass http://drf_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /admin/ {
            proxy_pass http://drf_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend Client: Static HTML/JS Mobile Web App
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
