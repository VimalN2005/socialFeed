events {
    worker_connections 1024;
}

http {
    upstream drf_backend {
        server core_api:8000;
    }

    upstream fastapi_backend {
        server ranking_api:8001;
    }

    server {
        listen 80;
        server_name localhost;

        # Client Max Body Size for Media Uploads (10MB)
        client_max_body_size 10M;

        # Gzip Compression
        gzip on;
        gzip_types text/plain application/json application/javascript text/css;

        # FastAPI: Feed Ranking & AI Endpoints
        location /api/v1/feed/ {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/ai/ {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # FastAPI: WebSocket Notification Gateway
        location /ws/ {
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # Django DRF: Auth, Users, Posts CRUD, Admin
        location / {
            proxy_pass http://drf_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
